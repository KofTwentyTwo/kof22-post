# KofTwentyTwo pre-commit configuration. Works with pre-commit and prek.
# Copy to the repository root as .pre-commit-config.yaml, then install both hook
# types once per clone:
#
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
#
# Every external hook is pinned to a full commit SHA with the release in a comment
# (`pre-commit autoupdate --freeze` keeps that format). The hooks are the local half
# of the CI gates in standards/ci-cd.md; CI runs the same tools again.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # File hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      # no-commit-to-branch is omitted until the first published version: the owner
      # decided on 2026-10-11 to work on main until then (README, "Standards").

  # Secrets (K22-CI-20): staged changes only, so it stays fast.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # Workflow security (K22-CI-23).
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--min-severity, medium]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  # Commit message: Conventional Commits header (K22-SDLC commit rules).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test]

  # Commit message: DCO sign-off (`git commit -s`). pygrep with --negate fails when
  # no line of the message matches.
  - repo: local
    hooks:
      - id: dco-sign-off
        name: DCO sign-off present (git commit -s)
        language: pygrep
        entry: '^Signed-off-by: .+ <.+@.+>$'
        args: [--negate]
        stages: [commit-msg]

  # Swift (configs/swift): the same commands CI runs (CONTRIBUTING.md).
  - repo: local
    hooks:
      - id: swift-format
        name: swift format lint --strict
        language: system
        entry: make format-check
        pass_filenames: false
        files: \.swift$
      - id: swiftlint
        name: swiftlint --strict
        language: system
        entry: swiftlint lint --strict --quiet
        pass_filenames: false
        files: \.swift$
