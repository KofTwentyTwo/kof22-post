# Build, format, lint, unit tests with the coverage gate, and UI tests (K22-CI-02,
# K22-CI-03, K22-TEST-10). Every step runs the same make target a developer runs
# locally (CONTRIBUTING.md).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Xcode is pinned (K22-CODE-SW tooling). Runner image and Xcode path must match.
  XCODE_PATH: /Applications/Xcode_27.0.app
  SWIFTLINT_VERSION: 0.65.1
  SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0

jobs:
  build-test:
    name: build-test
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"

      - name: Install SwiftLint (pinned, checksum verified)
        run: |
          curl -fsSL -o swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  swiftlint.zip" | shasum -a 256 -c -
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Unit tests and coverage gate
        run: make coverage

      - name: Build app (warnings are errors)
        run: make build-ci

      - name: UI tests
        run: make test-ui SIM="iPhone 17"
