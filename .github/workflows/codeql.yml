# CodeQL security-extended (K22-CI-22) for the workflows. Swift analysis is paused:
# CodeQL's tracer cannot load the compiler's macro plugins on the Xcode 27 image
# (issue #1, docs/standards-conformance.md). Re-add "swift" (manual build with
# `make build-codeql` on xcode-27) when that is fixed.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    uses: KofTwentyTwo/standards/.github/workflows/codeql.yml@70b555bd5658273090769991bfc4c9b6681dde18 # v1.2.1
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["actions"]'
