# KofTwentyTwo SwiftLint configuration (K22-CODE-SW). CI runs `swiftlint --strict`.
# Layout comes from swift-format (.swift-format: 3-space indent). Braces stay on the
# same line: neither swift-format nor SwiftLint can enforce next-line braces
# (K22-CODE-SW-02). SwiftLint's layout rules that would fight swift-format are disabled.
disabled_rules:
  - line_length
  - trailing_comma
  - opening_brace
  - vertical_whitespace
  - indentation_width
opt_in_rules:
  - explicit_init
  - fatal_error_message
  - force_unwrapping
  - implicitly_unwrapped_optional
  - missing_docs
  - no_magic_numbers
  - prefer_self_in_static_references
  - sorted_imports
  - unowned_variable_capture
  - todo
# Local adjustments to the standards v1.0.0 file, each matching the standard's own
# intent (reported upstream):
# - unused_declaration and unused_import only run under `swiftlint analyze`, so they
#   are listed as analyzer rules instead of opt-in rules.
# - statement_position uses uncuddled_else so SwiftLint agrees with swift-format's
#   lineBreakBeforeControlFlowKeywords (else/catch on a new line, K22-CODE-SW-01).
analyzer_rules:
  - unused_declaration
  - unused_import
statement_position:
  statement_mode: uncuddled_else
custom_rules:
  no_print:
    name: "Structured logging"
    regex: '^\s*(print|debugPrint|NSLog)\('
    message: "Use os.Logger (Kingsrook logging rule), not print/NSLog."
    severity: error
excluded:
  - .build
  - DerivedData
  - "**/Generated"
  # Generated by swift-openapi-generator (K22-CODE-25); regenerate with `make generate`.
  - Packages/KoF22Kit/Sources/KoF22API/Generated
  - Packages/KoF22Kit/.build
  - Tools/OpenAPIGen/.build
  - build
  - KoF22Post.xcodeproj
  # Temporary agent checkouts (git worktrees) are not part of this tree.
  - .claude
