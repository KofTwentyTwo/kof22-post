        required: false
        description: Blog slug (default quick-bits).
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        "200":
          description: Matching tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/me/link-preview:
    post:
      operationId: getLinkPreview
      tags:
      - Authoring
      summary: Preview a link
      description: "Fetches title, description and image server-side (public addresses\
        \ only)."
      security:
      - kof22OAuth:
        - kof22:publish
      - bearerAuth: []
      requestBody:
        required: true
