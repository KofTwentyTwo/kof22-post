  /v2/site/query:
    get:
      tags:
      - Sites
      summary: Search for Sites records by query string
      description: "Execute a query on this table, using query criteria as specified
        in query string parameters.\n\n* Pagination is managed via the `pageNo` &
        `pageSize` query string parameters.  pageNo starts at 1.  pageSize defaults
        to 50.\n* By default, the response includes the total count of records that
        match the query criteria.  The count can be omitted by specifying `includeCount=false`\n*
        By default, results are sorted by the table's primary key, descending.  This
        can be changed by specifying the `orderBy` query string parameter, following
        SQL ORDER BY syntax (e.g., `fieldName1 ASC, fieldName2 DESC`)\n* By default,
        all given query criteria are combined using logical AND.  This can be changed
        by specifying the query string parameter `booleanOperator=OR`.\n* Each field
        on the table can be used as a query criteria.  Each query criteria field can
        be specified on the query string any number of times.\n* By default, all criteria
        use the equals operator (e.g., `myField=value` means records will be returned
        where myField equals value).  Alternative operators can be used as follows:\n
        \ * Equals: `myField=value`\n  * Not Equals: `myField=!value`\n  * Less Than:
        `myField=&lt;value`\n  * Greater Than: `myField=&gt;value`\n  * Less Than
        or Equals: `myField=&lt;=value`\n  * Greater Than or Equals: `myField=&gt;=value`\n
        \ * Empty (or null): `myField=EMPTY`\n  * Not Empty: `myField=!EMPTY`\n  *
        Between: `myField=BETWEEN value1,value2` (two values must be given, separated
        by commas)\n  * Not Between: `myField=!BETWEEN value1,value2` (two values
        must be given, separated by commas)\n  * In: `myField=IN value1,value2,...,valueN`
        (one or more values must be given, separated by commas)\n  * Not In: `myField=!IN
        value1,value2,...,valueN` (one or more values must be given, separated by
        commas)\n  * Like: `myField=LIKE value` (using standard SQL % and _ wildcards)\n
        \ * Not Like: `myField=!LIKE value` (using standard SQL % and _ wildcards)\n"
      operationId: querySite
      parameters:
      - name: pageNo
        in: query
        schema:
          type: integer
        description: Which page of results to return.  Starts at 1.
      - name: pageSize
        in: query
        schema:
          type: integer
        description: Max number of records to include in a page.  Defaults to 50.  Must
          be between 1 and 1000.
      - name: includeCount
        in: query
        schema:
          type: boolean
          enum:
          - 'true'
          - 'false'
        description: Whether or not to include the count (total matching records)
          in the result. Default is true.
      - name: orderBy
        in: query
        schema:
          type: string
        description: How the results of the query should be sorted. SQL-style, comma-separated
          list of field names, each optionally followed by ASC or DESC (defaults to
          ASC).
      - name: booleanOperator
