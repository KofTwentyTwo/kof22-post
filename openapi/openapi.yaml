      properties:
        blog:
          type: string
        title:
          type: string
          maxLength: 100
          nullable: true
        body:
          type: string
          maxLength: 10000
        status:
          $ref: "#/components/schemas/PostStatus"
        publishAt:
          type: string
          format: date-time
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 50
        locationLabel:
          type: string
          maxLength: 200
          nullable: true
        linkUrl:
          type: string
          maxLength: 2000
          nullable: true
        media:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/MediaAttachment"
    UploadCreate:
      type: object
      required:
      - fileName
      - contentType
      - byteSize
      properties:
        fileName:
          type: string
          maxLength: 255
        contentType:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/heic
          - image/heif
        byteSize:
          type: integer
          format: int64
          maximum: 26214400
    UploadTicket:
      type: object
      required:
      - uploadId
      - uploadUrl
      - method
      - headers
      - expiresAt
      - maxBytes
      - completeUrl
      properties:
        uploadId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          description: Presigned URL; PUT the raw file bytes here
        method:
          type: string
          enum:
          - PUT
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers to send with the PUT (Content-Type)
        expiresAt:
          type: string
          format: date-time
        maxBytes:
          type: integer
          format: int64
        completeUrl:
          type: string
    UploadComplete:
      type: object
      properties:
        altText:
          type: string
          maxLength: 1000
        caption:
          type: string
          maxLength: 2000
        keepLocation:
          type: boolean
          default: false
          description: Keep EXIF including GPS (published publicly!)
    MediaItem:
      type: object
      required:
      - mediaId
      - url
      - mimeType
      - locationRemoved
      properties:
        mediaId:
          type: integer
          format: int64
        url:
          type: string
        thumbnailUrl:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        mimeType:
          type: string
        altText:
          type: string
          nullable: true
        caption:
          type: string
          nullable: true
        locationRemoved:
          type: boolean
    TagList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringTag"
    AuthoringTag:
      type: object
      required:
      - id
      - name
      - slug
      - blogId
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        blogId:
          type: integer
          format: int64
    LinkPreviewRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          maxLength: 2000
    LinkPreview:
      type: object
      required:
      - url
      properties:
        url:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
  responses:
    error400:
      description: Bad Request.  Some portion of the request's content was not acceptable
        to the server.  See error message in body for details.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Parameter id should be given an integer value, but received\
                  \ string: \"Foo\""
    error401:
      description: Unauthorized.  The required authentication credentials were missing
        or invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: The required authentication credentials were missing or invalid.
    error403:
      description: Forbidden.  You do not have permission to access the requested
        resource.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: You do not have permission to access the requested resource.
    error500:
      description: Internal Server Error.  An error occurred in the server while processing
        the request.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Database connection error.  Try again later.
    error429:
      description: Too Many Requests.  Your application has issued too many API requests
        in too short of a time frame.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Too Many Requests.  Your application has issued too many
                  API requests in too short of a time frame.
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "Missing, expired or invalid bearer token"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "Not allowed (scope, group or author profile)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found or not public
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "Conflict (idempotency key in flight, upload state, delete blocked)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionFailed:
      description: If-Match does not match the current version
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionRequired:
      description: If-Match is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: Unsupported file type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    kof22OAuth:
      type: oauth2
      description: "Authentik OAuth2, Authorization Code with PKCE (S256), public\
        \ client `kof22-post-ios`. Request `offline_access` for a refresh token."
      flows:
        authorizationCode:
          authorizationUrl: https://auth.kof22.com/application/o/authorize/
          tokenUrl: https://auth.kof22.com/application/o/token/
          refreshUrl: https://auth.kof22.com/application/o/token/
          scopes:
            openid: OpenID Connect
            profile: Name and groups
            email: Email (identifies your author profile)
            offline_access: Refresh tokens
            kof22:publish: Publish posts and photos to kof22.com
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "An access token from the kof22OAuth flow, pasted directly."
  parameters:
    BlogSlug:
      name: blogSlug
      in: path
      required: true
      schema:
        type: string
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 8-255 characters; the same key and body replays the first response
        for 24 hours.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag from the last read of this post.
      schema:
        type: string
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
  headers:
    ETag:
      description: "Version of the returned post, for If-Match."
      schema:
        type: string
    Location:
      description: URL of the created resource.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
