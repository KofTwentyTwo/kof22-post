openapi: 3.1.0
info:
  title: KoF22 Site API
  description: 'The public API of [kof22.com](https://www.kof22.com). It is the **same
    model the site''s admin uses**: every content table, with the admin''s field names,
    associations and actions. What you may do depends on who you are, exactly as in
    the admin.


    ## Overview


    - **Base URL:** `https://api.kof22.com/v2`. Every path below is relative to it.

    - **Anonymous callers** (no `Authorization` header) read published and active
    content only. Private fields (author email, photo and album GPS, storage keys,
    unprocessed originals) are left out. Writes and table actions answer `403`.

    - **Authenticated callers** send `Authorization: Bearer <access token>` (see *Authentication*)
    and get their own admin permissions: drafts, private fields, inserts, updates,
    deletes and table actions, as the admin allows them.

    - **Format:** JSON. Feeds are RSS, Atom or JSON Feed; the sitemap is XML.


    ## Quick start


    ```bash

    # the five newest Field Notes posts (blog slug quick-bits)

    curl "https://api.kof22.com/v2/blog/query?slug=quick-bits"

    curl "https://api.kof22.com/v2/blogPost/query?blogId=1&orderBy=publishDate%20DESC&pageSize=5"


    # one post with its tags (blogPostTagInt) and photos (blogPostMedia) nested

    curl "https://api.kof22.com/v2/blogPost/42"


    # search published content

    curl "https://api.kof22.com/v2/search?q=raspberry%20pi"

    ```


    ## Tables


    Every table of the admin''s CMS (Sites, Pages, Blog, Navigation, Media, Photography,
    Projects, Analytics) is a resource. The API name is the table name in camelCase
    without its module prefix (`blog_post` is `blogPost`, `photo_album_folder` is
    `photoAlbumFolder`); fields keep the admin''s names (`photoAlbumId`, `blogTagId`).
    The reference below lists every table, field (type, required, possible values)
    and association. `contentStream` is the read-only public activity stream.


    | Operation | Request |

    |-----------|---------|

    | Query | `GET /{table}/query?field=value&orderBy=...&pageNo=1&pageSize=50&includeCount=true`
    |

    | Get | `GET /{table}/{id}` (associations nested) |

    | Insert | `POST /{table}/` (associations may be nested) |

    | Update | `PATCH /{table}/{id}` (a nested association replaces that child list)
    |

    | Delete | `DELETE /{table}/{id}` |

    | Bulk | `POST`, `PATCH`, `DELETE /{table}/bulk` |

    | Table action | `POST /{table}/{action}?id=1,2` |


    **Filters:** `field=value` (equals), `field=!value`, `field=>=2026-01-01T00:00:00Z`
    (also `<=`, `<`, `>`), `field=IN 1,2,3`, `field=BETWEEN a,b`, `field=LIKE %pi%`,
    `field=EMPTY`; `booleanOperator=OR` combines them with OR. `orderBy=publishDate
    DESC,id DESC`. `pageSize` is 1 to 1000 (default 50). Query answers are `{"pageNo":1,"pageSize":50,"count":123,"records":[...]}`.


    ## Processes


    | Request | What |

    |---------|------|

    | `GET /search?q=&type=&limit=` | Search published posts, pages, projects, albums
    and photos. |

    | `GET /blog/feed/{slug}?format=rss` | A blog''s feed: `rss` (default), `atom`
    or `json`. |

    | `GET /sitemap` | The website''s sitemap (XML). |

    | `POST /contact` | Message the site owner: `{"name","email","subject","message"}`;
    leave `website` empty (honeypot) and send `startedAt` (epoch ms the form was shown).
    `202` on success. |

    | `GET /me` | Who the bearer token is, its permissions, author profile and blogs.
    |

    | `POST /media/createUpload` | `{"fileName","contentType","byteSize"}`: a presigned
    `PUT` to a private bucket. |

    | `POST /media/completeUpload/{uploadId}` | `{"altText","caption","keepLocation"}`:
    sanitize (EXIF GPS removed unless `keepLocation`), renditions, `media` record.
    |

    | `POST /blogPost/linkPreview` | `{"url"}`: title, description and image of a
    public page. |

    | `POST /preview` | `{"token"}` from the CMS "Preview on site" link: that draft
    (`type`, `path`, `url`, `live`, `record`). Server-side use by the website; `private,
    no-store`. |

    | `POST /blogPost/publishBlogPost?id=` and the other table actions | The admin''s
    actions on those records. |


    ## Authentication


    Without a token you are anonymous. With `Authorization: Bearer <access token>`
    from the KoF22 Authentik provider you are that user, with that user''s admin permissions.
    The KoF22 Post app uses OAuth2 Authorization Code with PKCE (public client `kof22-post-ios`,
    scopes `openid profile email offline_access kof22:publish`); the token must carry
    the `kof22:publish` grant and the user must be in `kof22-admins` or `kof-website-publishers`.
    An invalid or expired token is a `401`; a valid token without a permission is
    a `403`.


    | Endpoint | URL |

    |----------|-----|

    | Authorize | `https://auth.kof22.com/application/o/authorize/` |

    | Token | `https://auth.kof22.com/application/o/token/` |

    | Revoke | `https://auth.kof22.com/application/o/revoke/` |

    | User info | `https://auth.kof22.com/application/o/userinfo/` |

    | Issuer / JWKS | `https://auth.kof22.com/application/o/kof22-post-ios/` (`jwks/`)
    |


    Access tokens last 30 minutes; refresh tokens (granted with `offline_access`)
    last 90 days.


    ## iOS app (KoF22 Post) on v2


    **Sign in** as before: PKCE `S256` with a random single-use `state`, `ASWebAuthenticationSession`
    with callback scheme `com.kof22.post` (redirect `com.kof22.post://oauth/callback`)
    or the universal link `https://api.kof22.com/oauth/ios-callback` (needs `SITE_API_IOS_APP_IDS`
    on the server for [`/.well-known/apple-app-site-association`](https://api.kof22.com/.well-known/apple-app-site-association)).
    Exchange the code with `client_id=kof22-post-ios` and the `code_verifier` (no
    client secret), keep tokens in the Keychain, refresh before the access token expires,
    revoke on sign-out.


    **Then use the standard tables and processes:**


    1. `GET /me` for the author profile (`author.id`), the blogs (`defaultBlog` is
    `quick-bits`) and permissions.

    2. Photos: `POST /media/createUpload`, `PUT` the bytes to `uploadUrl` with the
    returned headers, then `POST /media/completeUpload/{uploadId}`; keep `mediaId`.

    3. Tags: `GET /blogTag/query?blogId=1&name=LIKE pi%` to find, `POST /blogTag/`
    `{"blogId","name"}` to create (the slug is derived).

    4. Post: `POST /blogPost/` with `{"blogId","authorId","content","tags":[{"blogTagId":7}],
    "media":[{"mediaId":51,"sortOrder":0,"altText":"..."}]}`. `title`, `name`, `shortName`
    and `slug` are derived from the body when absent; send `excerpt` and `readTime`
    yourself. Publish now with `"isPublished":true` and a `publishDate`, or schedule
    with `"scheduledPublishAt":"2026-11-01T09:00:00Z"`; omit both for a draft.

    5. Edit with `PATCH /blogPost/{id}` (sending `tags` or `media` replaces that list),
    delete with `DELETE /blogPost/{id}`, list with `GET /blogPost/query?authorId={id}&orderBy=modifyDate
    DESC`.

    6. Link posts: `POST /blogPost/linkPreview` `{"url"}`, then store `linkUrl`, `linkTitle`,
    `linkDescription`, `linkImageUrl` on the post.


    Send the bearer token on every request the app makes; content reads with a token
    also see your drafts.


    ## Errors


    Errors are `{"error": "message"}`; the Site API''s own processes add a machine-readable
    `code` (and `details` with `field` and `issue` for validation). `400` bad request,
    `401` missing or invalid token (where one is required), `403` not permitted, `404`
    not found or not visible to you, `409` conflict, `413` too large, `415` unsupported
    media type, `422` validation, `429` rate limited (honour `Retry-After`).


    ## Caching and CORS


    Anonymous `GET` answers are shared-cacheable (`Cache-Control: public, max-age=60,
    s-maxage=60, stale-while-revalidate=60, stale-if-error=86400`; feeds and sitemap
    300 s) with a weak `ETag` (`If-None-Match` gives `304`) and `Access-Control-Allow-Origin:
    *`. Anything with a token, and every write, is `private, no-store`, and browsers
    may send it only from www.kof22.com.


    ## Versioning


    The major version is in the path (`/v2`); the full semantic version is the OpenAPI
    `info.version` and in [`/versions.json`](https://api.kof22.com/versions.json).
    Patch: fixes. Minor: additive (new tables, fields, actions; clients ignore unknown
    fields). Major: breaking. A new admin table, field or action appears here as a
    minor version, because the API is generated from the admin''s model.


    ### Changelog


    **2.1.0** (2026-10-13)


    - POST /preview: exchange a short-lived signed preview token (from the CMS "Preview
    on site" link) for one draft, in its table''s v2 shape plus its future path. The
    token is the credential; private, no-store, noindex.

    - New table permalinkTemplate: the CMS page URL patterns (CMS > Sites > Page URL
    Patterns); anonymous callers read the public site''s active rows.

    - Content tables return sitePath and siteUrl (read-only): the record''s page on
    the website, for public records.

    - Search results, feeds and the sitemap build record URLs from the page URL patterns
    (the same URLs as before).


    **2.0.0** (2026-10-12)


    - The API is the admin''s model, published: every CMS table, field (admin names),
    association and table action, generated from the same QQQ metadata.

    - Same rules as the admin: anonymous callers read published content; a bearer
    token gets that user''s admin permissions (insert, update, delete, bulk, table
    actions).

    - Search, feeds, sitemap, contact, uploads and link previews are API processes
    (/search, /blog/feed/{slug}, /sitemap, /contact, /media/createUpload, /media/completeUpload/{uploadId},
    /blogPost/linkPreview, /me).

    - Breaking: v1 and /public-api are removed. Table and field names are the admin''s
    (post is blogPost, albumId is photoAlbumId, ...); errors are {"error", "code"}.


    **1.2.0** (2026-10-12)


    - Caching headers, ETag/304 and public-read CORS.


    **1.1.0** (2026-10-11)


    - Documentation: iOS app setup (KoF22 Post).


    **1.0.0** (2026-10-11)


    - First release at https://api.kof22.com/v1 (curated resources; retired by 2.0.0).




    ## Support


    Email **[james@kof22.com](mailto:james@kof22.com)** with the request path, the
    time (UTC), the HTTP status and the error body.

    '
