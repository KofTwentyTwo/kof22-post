  /v1/me/posts:
    get:
      operationId: listMyPosts
      tags:
      - Authoring
      summary: List my posts
      description: "My posts, most recently changed first, with cursor pagination."
      security:
      - kof22OAuth:
        - kof22:publish
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/PostStatus"
      - name: cursor
        in: query
        required: false
        description: The `nextCursor` of the previous page.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        "200":
          description: A page of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createPost
      tags:
      - Authoring
      summary: Create a post
      description: "Creates a draft, publishes immediately (`status: published`) or\
        \ schedules (`status: scheduled` with `publishAt`). Retry-safe with `Idempotency-Key`."
      security:
      - kof22OAuth:
        - kof22:publish
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreate"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/me/posts/{postId}:
    parameters:
    - $ref: "#/components/parameters/PostId"
    get:
      operationId: getMyPost
      tags:
      - Authoring
      summary: Get one of my posts
      security:
      - kof22OAuth:
        - kof22:publish
      - bearerAuth: []
      responses:
        "200":
          description: The post
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringPost"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePost
      tags:
      - Authoring
      summary: Update one of my posts
      description: Omitted fields are unchanged; `null` clears optional fields. `tags`
        and `media` replace the whole list. Requires `If-Match` with the current ETag.
      security:
      - kof22OAuth:
        - kof22:publish
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdate"
      responses:
        "200":
          description: Updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deletePost
      tags:
      - Authoring
      summary: Delete one of my posts
      security:
      - kof22OAuth:
        - kof22:publish
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/IfMatchOptional"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /v1/me/uploads:
    post:
      operationId: createUpload
      tags:
      - Authoring
      summary: Start a photo upload
      description: "Returns a presigned `uploadUrl`. PUT the file bytes there with\
        \ the returned headers (within 15 minutes; PUT is retry-safe), then call `completeUpload`.\
        \ JPEG, PNG and HEIC (when the server converter is enabled); at most 25 MB.\
        \ Photos only."
      security:
      - kof22OAuth:
        - kof22:publish
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCreate"
      responses:
        "201":
          description: Upload ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTicket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/me/uploads/{uploadId}/complete:
    post:
      operationId: completeUpload
      tags:
      - Authoring
      summary: Finish a photo upload
      description: "Verifies the uploaded bytes, converts HEIC, strips EXIF location\
        \ data unless `keepLocation` is true, generates renditions and returns the\
        \ media to attach to a post. Calling it again returns the same media."
      security:
      - kof22OAuth:
        - kof22:publish
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/UploadId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadComplete"
      responses:
        "200":
          description: The published photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /v1/me/tags:
    get:
      operationId: listMyTags
      tags:
      - Authoring
      summary: Tag autocomplete
      security:
      - kof22OAuth:
        - kof22:publish
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: blog
