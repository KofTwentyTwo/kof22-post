  /v1/post/{id}:
    get:
      summary: Get one Blog Post by Id
      description: |
        Get one record from this table, by specifying its primary key as a path parameter.
      operationId: getPost
      tags:
      - Content
      parameters:
      - name: id
        description: Id of the Blog Post to get.
        required: true
        in: path
        schema:
          type: integer
      responses:
        "400":
          $ref: "#/components/responses/error400"
        "401":
          $ref: "#/components/responses/error401"
        "403":
          $ref: "#/components/responses/error403"
        "500":
          $ref: "#/components/responses/error500"
        "404":
          description: The requested Blog Post record was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Successfully got the requested Blog Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post"
        "429":
          $ref: "#/components/responses/error429"
  /v1/blog/query:
    get:
      summary: Search for Blogs records by query string
      description: |
        Execute a query on this table, using query criteria as specified in query string parameters.

        * Pagination is managed via the `pageNo` & `pageSize` query string parameters.  pageNo starts at 1.  pageSize defaults to 50.
        * By default, the response includes the total count of records that match the query criteria.  The count can be omitted by specifying `includeCount=false`
        * By default, results are sorted by the table's primary key, descending.  This can be changed by specifying the `orderBy` query string parameter, following SQL ORDER BY syntax (e.g., `fieldName1 ASC, fieldName2 DESC`)
        * By default, all given query criteria are combined using logical AND.  This can be changed by specifying the query string parameter `booleanOperator=OR`.
        * Each field on the table can be used as a query criteria.  Each query criteria field can be specified on the query string any number of times.
        * By default, all criteria use the equals operator (e.g., `myField=value` means records will be returned where myField equals value).  Alternative operators can be used as follows:
          * Equals: `myField=value`
          * Not Equals: `myField=!value`
          * Less Than: `myField=&lt;value`
          * Greater Than: `myField=&gt;value`
          * Less Than or Equals: `myField=&lt;=value`
          * Greater Than or Equals: `myField=&gt;=value`
          * Empty (or null): `myField=EMPTY`
          * Not Empty: `myField=!EMPTY`
          * Between: `myField=BETWEEN value1,value2` (two values must be given, separated by commas)
          * Not Between: `myField=!BETWEEN value1,value2` (two values must be given, separated by commas)
          * In: `myField=IN value1,value2,...,valueN` (one or more values must be given, separated by commas)
          * Not In: `myField=!IN value1,value2,...,valueN` (one or more values must be given, separated by commas)
          * Like: `myField=LIKE value` (using standard SQL % and _ wildcards)
          * Not Like: `myField=!LIKE value` (using standard SQL % and _ wildcards)
      operationId: queryBlog
      tags:
      - Content
      parameters:
      - name: pageNo
        description: Which page of results to return.  Starts at 1.
        in: query
        schema:
          type: integer
      - name: pageSize
        description: Max number of records to include in a page.  Defaults to 50.  Must
          be between 1 and 1000.
        in: query
        schema:
          type: integer
      - name: includeCount
        description: Whether or not to include the count (total matching records)
          in the result. Default is true.
        in: query
        schema:
          type: boolean
          enum:
          - "true"
          - "false"
      - name: orderBy
        description: "How the results of the query should be sorted. SQL-style, comma-separated\
          \ list of field names, each optionally followed by ASC or DESC (defaults\
          \ to ASC)."
        in: query
        schema:
          type: string
        examples:
          default:
            summary: "default:  order by id descending"
            value:
            - ""
          id:
            summary: "order by id (ascending, since ASC/DESC was not specified)"
            value: id
          idDesc:
            summary: order by id descending
            value: id DESC
          idAsc:
            summary: order by id ascending
            value: id ASC
          descriptionAndMetaDescription:
            summary: "order by description, then by metaDescription (both ascending)"
            value: "description, metaDescription"
          metaKeywordsAndMetaTitleAndModifyDate:
            summary: "order by metaKeywords descending, then by metaTitle ascending,\
              \ then by modifyDate"
            value: "metaKeywords DESC, metaTitle ASC, modifyDate"
      - name: booleanOperator
        description: Whether to combine query field as an AND or an OR.  Default is
          AND.
        in: query
        schema:
          type: string
          enum:
          - AND
          - OR
      - name: description
        description: "Query on the Description field.  Can prefix value with an operator,\
          \ else defaults to = (equals)."
        in: query
        schema:
          type: array
          items:
            type: string
        explode: true
        examples:
          criteriaNotQueried:
            $ref: "#/components/examples/criteriaNotQueried"
          criteriaStringEquals:
            $ref: "#/components/examples/criteriaStringEquals"
          criteriaStringNotEquals:
            $ref: "#/components/examples/criteriaStringNotEquals"
          criteriaStringLessThan:
            $ref: "#/components/examples/criteriaStringLessThan"
          criteriaStringGreaterThan:
