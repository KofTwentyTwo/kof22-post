components:
  securitySchemes:
    kof22OAuth:
      type: oauth2
      description: >-
        Authentik OAuth2, Authorization Code with PKCE (S256), public client
        `kof22-post-ios`. Request `offline_access` for a refresh token.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.kof22.com/application/o/authorize/
          tokenUrl: https://auth.kof22.com/application/o/token/
          refreshUrl: https://auth.kof22.com/application/o/token/
          scopes:
            openid: OpenID Connect
            profile: Name and groups
            email: Email (identifies your author profile)
            offline_access: Refresh tokens
            "kof22:publish": Publish posts and photos to kof22.com
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token from the kof22OAuth flow, pasted directly.
  parameters:
    BlogSlug:
      name: blogSlug
      in: path
      required: true
      schema: { type: string }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 8-255 characters; the same key and body replays the first response for 24 hours.
      schema: { type: string, minLength: 8, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag from the last read of this post.
      schema: { type: string }
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema: { type: string }
  headers:
    ETag:
      description: Version of the returned post, for If-Match.
      schema: { type: string }
    Location:
      description: URL of the created resource.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }
  responses:
    BadRequest:
      description: Malformed request
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Missing, expired or invalid bearer token
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Not allowed (scope, group or author profile)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found or not public
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Conflict (idempotency key in flight, upload state, delete blocked)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PreconditionFailed:
      description: If-Match does not match the current version
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PreconditionRequired:
      description: If-Match is required
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PayloadTooLarge:
      description: Too large
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    UnsupportedMediaType:
      description: Unsupported file type
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ValidationFailed:
      description: Validation failed
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ServiceUnavailable:
      description: Temporarily unavailable
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }
    ErrorBody:
      type: object
      required: [code, message, status]
      properties:
        code: { type: string, description: "Machine-readable code, e.g. validation_failed" }
        message: { type: string }
        status: { type: integer }
        details:
          type: array
          items: { $ref: "#/components/schemas/ErrorDetail" }
    ErrorDetail:
      type: object
      required: [field, issue]
      properties:
        field: { type: string }
        issue: { type: string }
    Versions:
      type: object
      required: [currentVersion, supportedVersions, versions]
      properties:
        currentVersion: { type: string, example: v1 }
        supportedVersions:
          type: array
          items: { type: string }
        versions:
          type: array
          items: { $ref: "#/components/schemas/VersionInfo" }
    VersionInfo:
      type: object
      required: [version, semver, status, docsUrl, openapiUrl]
      properties:
        version: { type: string, example: v1 }
        semver: { type: string, example: 1.0.0 }
        status: { type: string, enum: [current, deprecated] }
        released: { type: string, format: date }
        docsUrl: { type: string }
        openapiUrl: { type: string }
        changelog:
          type: array
          items: { $ref: "#/components/schemas/ReleaseNote" }
    ReleaseNote:
      type: object
      required: [version, date, changes]
      properties:
        version: { type: string }
        date: { type: string, format: date }
        changes:
          type: array
          items: { type: string }
    SearchResults:
      type: object
      required: [query, results]
      properties:
        query: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }
    SearchHit:
      type: object
      required: [type, id, title, url]
      properties:
        type: { type: string, enum: [post, page, project, album, photo] }
        id: { type: integer, format: int64 }
        title: { type: string }
        url: { type: string, description: Website URL of the result }
        snippet: { type: string, nullable: true }
        score: { type: number, format: float, nullable: true }
    ContactRequest:
      type: object
      required: [name, email, message]
      properties:
        name: { type: string, maxLength: 200 }
        email: { type: string, format: email, maxLength: 320 }
        subject: { type: string, maxLength: 200 }
        message: { type: string, minLength: 10, maxLength: 5000 }
        website: { type: string, description: Honeypot. Must be empty. }
        startedAt: { type: integer, format: int64, description: Epoch milliseconds when the form was shown. }
    ContactAccepted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted] }
    JsonFeed:
      type: object
      description: A JSON Feed 1.1 document (https://www.jsonfeed.org/version/1.1/).
      additionalProperties: true
      properties:
        version: { type: string }
        title: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/JsonFeedItem" }
    JsonFeedItem:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        url: { type: string }
        title: { type: string }
        content_text: { type: string }
        content_html: { type: string }
        summary: { type: string }
        date_published: { type: string, format: date-time }
    Me:
      type: object
      required: [email, groups, canPost, blogs, defaultBlog, limits]
      properties:
        email: { type: string }
        name: { type: string, nullable: true }
        groups:
          type: array
          items: { type: string }
        author: { $ref: "#/components/schemas/AuthorRef" }
        canPost: { type: boolean }
        blogs:
          type: array
          items: { $ref: "#/components/schemas/BlogRef" }
        defaultBlog: { type: string }
        limits: { $ref: "#/components/schemas/AuthoringLimits" }
    AuthorRef:
      type: object
      nullable: true
      required: [id, name, slug]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
    BlogRef:
      type: object
      required: [id, slug, name, isDefault]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string }
        isDefault: { type: boolean }
    AuthoringLimits:
      type: object
      required: [maxBodyLength, maxTitleLength, maxTags, maxPhotosPerPost, maxPhotoBytes, photoContentTypes]
      properties:
        maxBodyLength: { type: integer }
        maxTitleLength: { type: integer }
        maxTags: { type: integer }
        maxPhotosPerPost: { type: integer }
        maxPhotoBytes: { type: integer, format: int64 }
        photoContentTypes:
          type: array
          items: { type: string }
    PostStatus:
      type: string
      enum: [draft, scheduled, published]
    AuthoringPost:
      type: object
      required: [id, blogId, blog, status, title, body, slug, tags, media, version]
      properties:
        id: { type: integer, format: int64 }
        blogId: { type: integer, format: int64 }
        blog: { type: string, description: Blog slug }
        status: { $ref: "#/components/schemas/PostStatus" }
        title: { type: string }
        body: { type: string, description: Markdown }
        slug: { type: string }
        url: { type: string, nullable: true, description: Public URL once published }
        publishAt: { type: string, format: date-time, nullable: true, description: Scheduled publish time }
        publishedAt: { type: string, format: date-time, nullable: true }
        tags:
          type: array
          items: { type: string }
        locationLabel: { type: string, nullable: true }
        link: { $ref: "#/components/schemas/PostLink" }
        media:
          type: array
          items: { $ref: "#/components/schemas/PostPhoto" }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        version: { type: string, description: Same value as the ETag (without quotes) }
    PostLink:
      type: object
      nullable: true
      required: [url]
      properties:
        url: { type: string }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
    PostPhoto:
      type: object
      required: [mediaId, url]
      properties:
        mediaId: { type: integer, format: int64 }
        url: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        altText: { type: string, nullable: true }
        caption: { type: string, nullable: true }
    PostPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuthoringPost" }
        nextCursor: { type: string, nullable: true }
    MediaAttachment:
      type: object
      required: [mediaId]
      properties:
        mediaId: { type: integer, format: int64 }
        altText: { type: string, maxLength: 1000 }
        caption: { type: string, maxLength: 2000 }
    PostCreate:
      type: object
      required: [body]
      properties:
        blog: { type: string, description: Blog slug (default quick-bits) }
        title: { type: string, maxLength: 100, description: Optional; derived from the first line of the body when omitted }
        body: { type: string, maxLength: 10000, description: Markdown }
        status: { $ref: "#/components/schemas/PostStatus" }
        publishAt: { type: string, format: date-time, description: Required when status is scheduled }
        tags:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 50 }
        locationLabel: { type: string, maxLength: 200 }
        linkUrl: { type: string, maxLength: 2000, description: Link to preview server-side }
        media:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/MediaAttachment" }
    PostUpdate:
      type: object
      properties:
        blog: { type: string }
        title: { type: string, maxLength: 100, nullable: true }
        body: { type: string, maxLength: 10000 }
        status: { $ref: "#/components/schemas/PostStatus" }
        publishAt: { type: string, format: date-time }
        tags:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 50 }
        locationLabel: { type: string, maxLength: 200, nullable: true }
        linkUrl: { type: string, maxLength: 2000, nullable: true }
        media:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/MediaAttachment" }
    UploadCreate:
      type: object
      required: [fileName, contentType, byteSize]
      properties:
        fileName: { type: string, maxLength: 255 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/heic, image/heif] }
        byteSize: { type: integer, format: int64, maximum: 26214400 }
    UploadTicket:
      type: object
      required: [uploadId, uploadUrl, method, headers, expiresAt, maxBytes, completeUrl]
      properties:
        uploadId: { type: string, format: uuid }
        uploadUrl: { type: string, description: Presigned URL; PUT the raw file bytes here }
        method: { type: string, enum: [PUT] }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Headers to send with the PUT (Content-Type)
        expiresAt: { type: string, format: date-time }
        maxBytes: { type: integer, format: int64 }
        completeUrl: { type: string }
    UploadComplete:
      type: object
      properties:
        altText: { type: string, maxLength: 1000 }
        caption: { type: string, maxLength: 2000 }
        keepLocation: { type: boolean, default: false, description: Keep EXIF including GPS (published publicly!) }
    MediaItem:
      type: object
      required: [mediaId, url, mimeType, locationRemoved]
      properties:
        mediaId: { type: integer, format: int64 }
        url: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        mimeType: { type: string }
        altText: { type: string, nullable: true }
        caption: { type: string, nullable: true }
        locationRemoved: { type: boolean }
    TagList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuthoringTag" }
    AuthoringTag:
      type: object
      required: [id, name, slug, blogId]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        blogId: { type: integer, format: int64 }
    LinkPreviewRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2000 }
    LinkPreview:
      type: object
      required: [url]
      properties:
        url: { type: string }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
