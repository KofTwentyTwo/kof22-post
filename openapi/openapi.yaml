          type: array
          items:
            type: string
          minItems: 0
          uniqueItems: false
        description: Query on the Email field.  Can prefix value with an operator,
          else defaults to = (equals).
      - name: id
        in: query
        schema:
          type: array
          items:
            type: string
          minItems: 0
          uniqueItems: false
        description: Query on the Id field.  Can prefix value with an operator, else
