      description: "Full-text search over published posts, pages, projects, albums\
        \ and photos."
      parameters:
      - name: q
        in: query
        required: true
        description: Search term (2-200 characters).
        schema:
          type: string
          minLength: 2
          maxLength: 200
      - name: type
        in: query
        required: false
        description: "Comma-separated result types to include (post, page, project,\
          \ album, photo)."
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        "200":
          description: Matching public records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "422":
          $ref: "#/components/responses/ValidationFailed"
