            application/json:
              schema:
                $ref: "#/components/schemas/LinkPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  examples:
    criteriaNotQueried:
      summary: no query on this field
      value:
      - ""
    criteriaNumberEquals:
      summary: equal to 47
      value:
      - 47
    criteriaNumberNotEquals:
      summary: not equal to 47
      value:
      - '!47'
    criteriaNumberLessThan:
      summary: less than 47
      value:
      - <47
    criteriaNumberGreaterThan:
      summary: greater than 47
      value:
      - '>47'
    criteriaNumberLessThanOrEquals:
      summary: less than or equal to 47
      value:
      - <=47
    criteriaNumberGreaterThanOrEquals:
      summary: greater than or equal to 47
      value:
      - '>=47'
    criteriaNumberEmpty:
      summary: null value
      value:
      - EMPTY
    criteriaNumberNotEmpty:
      summary: non-null value
      value:
      - '!EMPTY'
    criteriaNumberBetween:
      summary: between 42 and 47
      value:
      - "BETWEEN 42,47"
    criteriaNumberNotBetween:
      summary: not between 42 and 47
      value:
      - "!BETWEEN 42,47"
    criteriaNumberIn:
      summary: "any of 1701, 74205, or 74656"
      value:
      - "IN 1701,74205,74656"
    criteriaNumberNotIn:
      summary: "not any of 1701, 74205, or 74656"
      value:
      - "!IN 1701,74205,74656"
    criteriaNumberMultiple:
      summary: "multiple criteria: between 42 and 47 and not equal to 45"
      value:
      - "BETWEEN 42,47"
      - '!45'
    criteriaBooleanEquals:
      summary: equal to true
      value:
      - "true"
    criteriaBooleanNotEquals:
      summary: not equal to true
      value:
      - '!true'
    criteriaBooleanEmpty:
      summary: null value
      value:
      - EMPTY
    criteriaBooleanNotEmpty:
      summary: non-null value
      value:
      - '!EMPTY'
    criteriaDateTimeEquals:
      summary: equal to 2001-01-01T00:00:00Z
      value:
      - 2001-01-01T00:00:00Z
    criteriaDateTimeNotEquals:
      summary: not equal to 2001-01-01T00:00:00Z
      value:
      - '!2001-01-01T00:00:00Z'
    criteriaDateTimeLessThan:
      summary: less than 2001-01-01T00:00:00Z
      value:
      - <2001-01-01T00:00:00Z
    criteriaDateTimeGreaterThan:
      summary: greater than 2001-01-01T00:00:00Z
      value:
      - '>2001-01-01T00:00:00Z'
    criteriaDateTimeLessThanOrEquals:
      summary: less than or equal to 2001-01-01T00:00:00Z
      value:
      - <=2001-01-01T00:00:00Z
    criteriaDateTimeGreaterThanOrEquals:
      summary: greater than or equal to 2001-01-01T00:00:00Z
      value:
      - '>=2001-01-01T00:00:00Z'
    criteriaDateTimeEmpty:
      summary: null value
      value:
      - EMPTY
    criteriaDateTimeNotEmpty:
      summary: non-null value
      value:
      - '!EMPTY'
    criteriaDateTimeBetween:
      summary: between 2000-10-03T00:00:00Z and 2001-01-01T00:00:00Z
      value:
